<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cosmiatría Laya: cuidado y tratamientos para tu piel.">
  <title>COSMIATRIA LAYA</title>

  <style>
    :root {
      --rosa: #b85f78;
      --rosa-oscuro: #91445c;
      --rosa-claro: #f8edf0;
      --crema: #fffaf7;
      --texto: #392d31;
      --gris: #74676b;
      --blanco: #fff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--texto);
      background: var(--crema);
      line-height: 1.6;
    }

    a { color: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 15px 7%;
      background: rgba(255, 250, 247, .96);
      box-shadow: 0 2px 14px #392d3110;
    }

    .marca {
      color: var(--rosa-oscuro);
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: .04em;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      font-size: .95rem;
    }

    nav a:hover { color: var(--rosa); }

    .portada {
      min-height: 78vh;
      padding: 90px 8%;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 45px;
      background:
        radial-gradient(circle at 80% 35%, #f2dce2 0, transparent 36%),
        linear-gradient(135deg, var(--crema), var(--rosa-claro));
    }

    .etiqueta {
      color: var(--rosa-oscuro);
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: .8rem;
      font-weight: bold;
    }

    h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; }

    h1 {
      margin: 12px 0 18px;
      font-size: clamp(2.8rem, 6vw, 5rem);
      line-height: 1.04;
      color: #513642;
    }

    .portada p {
      max-width: 570px;
      color: var(--gris);
      font-size: 1.1rem;
    }

    .boton {
      display: inline-block;
      border: 0;
      border-radius: 30px;
      padding: 13px 23px;
      background: var(--rosa);
      color: var(--blanco);
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
    }

    .boton:hover {
      background: var(--rosa-oscuro);
      transform: translateY(-2px);
    }

    .foto {
      min-height: 360px;
      display: grid;
      place-items: center;
      border: 1px solid #fff;
      border-radius: 48% 48% 24px 24px;
      background: linear-gradient(145deg, #e9c7d0, #c98296);
      color: #fff;
      font-size: 5rem;
      box-shadow: 0 20px 50px #91445c25;
    }

    section { padding: 76px 8%; }

    .titulo {
      margin: 0 0 12px;
      text-align: center;
      color: #513642;
      font-size: clamp(2rem, 4vw, 2.8rem);
    }

    .intro {
      max-width: 680px;
      margin: 0 auto 38px;
      color: var(--gris);
      text-align: center;
    }

    .servicios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .tarjeta {
      padding: 26px;
      border: 1px solid #f0e0e4;
      border-radius: 18px;
      background: var(--blanco);
      box-shadow: 0 8px 24px #392d3108;
    }

    .tarjeta .icono { font-size: 2rem; }

    .tarjeta h3 {
      margin: 8px 0;
      color: var(--rosa-oscuro);
    }

    .tarjeta p { margin-bottom: 0; color: var(--gris); }

    .acerca {
      background: var(--rosa-claro);
      text-align: center;
    }

    .acerca p {
      max-width: 760px;
      margin: 16px auto 0;
      color: var(--gris);
    }

    .agenda {
      background: #fff;
    }

    .formulario {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px;
      border: 1px solid #f0e0e4;
      border-radius: 18px;
      background: var(--crema);
    }

    .campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: .93rem;
    }

    input, select, textarea {
      width: 100%;
      min-height: 45px;
      padding: 10px 12px;
      border: 1px solid #ddcbd0;
      border-radius: 9px;
      background: white;
      color: var(--texto);
      font: inherit;
    }

    textarea { min-height: 90px; resize: vertical; }

    .campo { margin-bottom: 15px; }
    .ancho-completo { grid-column: 1 / -1; }

    .redes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .red-social {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #e7c9d2;
      border-radius: 24px;
      color: var(--rosa-oscuro);
      background: white;
      font-weight: bold;
      text-decoration: none;
    }

    .red-social:hover {
      color: white;
      background: var(--rosa);
    }

    .contacto { text-align: center; }

    footer {
      padding: 22px 7%;
      background: #513642;
      color: white;
      text-align: center;
      font-size: .9rem;
    }

    .admin-acceso {
      margin-top: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #f5dce3;
      text-decoration: underline;
      cursor: pointer;
      font: inherit;
      font-size: .8rem;
    }

    dialog {
      width: min(94%, 760px);
      max-height: 90vh;
      padding: 26px;
      border: 0;
      border-radius: 18px;
      color: var(--texto);
      background: var(--crema);
      box-shadow: 0 20px 80px #0005;
