<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Mantenimiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #5a189a, #7b2cbf, #9d4edd);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .caja-mantenimiento {
            background: #fff;
            color: #333;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
            max-width: 500px;
            width: 90%;
        }
        .icono {
            font-size: 70px;
            margin-bottom: 20px;
        }
        h1 {
            color: #5a189a;
            font-size: 28px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 10px;
        }
        .mensaje-final {
            font-weight: bold;
            color: #7b2cbf;
            margin-top: 15px;
        }
        .barra {
            width: 100%;
            height: 10px;
            background: #e0cffc;
            border-radius: 5px;
            margin-top: 25px;
            overflow: hidden;
        }
        .llenado {
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, #5a189a, #22c55e);
            border-radius: 5px;
            animation: cargando 2s ease-in-out infinite alternate;
        }
        @keyframes cargando {
            from { width: 55%; }
            to   { width: 85%; }
        }
    </style>
</head>
<body>

    <div class="caja-mantenimiento">
        <div class="icono">🚧</div>
        <h1>Sitio en Mantenimiento</h1>
        <p>Estamos trabajando para mejorar tu experiencia.</p>
        <p>Hacemos lo mejor posible para que todo vuelva a funcionar pronto.</p>
        <p class="mensaje-final">¡Gracias por tu paciencia!</p>
        <div class="barra">
            <div class="llenado"></div>
        </div>
    </div>

</body>
</html>
